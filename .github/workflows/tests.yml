name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Smoke run (one task, must exit 0)
        run: python -m rsagent.cli --task "去配电柜A和机柜B看温度，最后回充"

      - name: Batch benchmark (short run, asserts metrics are produced)
        run: python bench/run_bench.py --rounds 6

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-py${{ matrix.python-version }}
          path: |
            bench/out/metrics.json
            bench/out/summary.md
          if-no-files-found: warn
